[project]
name = "modal-explore"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.2",
    "openml>=0.15.1",
    "tabpfn>=8.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
